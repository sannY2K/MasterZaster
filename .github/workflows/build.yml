name: Build (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar (Release)
        run: cmake --build build --config Release --parallel

      - name: Tests del nucleo
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Descargar pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Validar VST3 con pluginval
        shell: pwsh
        run: |
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests "build/MasterZaster_artefacts/Release/VST3/MasterZaster.vst3"

      - name: Subir artefacto VST3
        uses: actions/upload-artifact@v4
        with:
          name: MasterZaster-VST3-windows
          path: build/MasterZaster_artefacts/Release/VST3/MasterZaster.vst3
